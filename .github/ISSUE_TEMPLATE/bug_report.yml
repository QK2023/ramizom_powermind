name: Bug report
description: Report a reproducible problem in Ramizom PowerMind Preview
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thank you for providing a synthetic reproduction. Never attach private notes or real workspace exports.
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: dropdown
    id: storage
    attributes:
      label: Storage mode
      options:
        - System folder
        - Browser database
        - Unknown
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, browser and version, device, and input method
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Additional diagnostics
      description: Include console errors or a redacted screenshot if relevant.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed private notes, local paths, credentials, and personal information.
          required: true
